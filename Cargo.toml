[package]
name = "rust-ui"
version = "0.1.0"
edition = "2024"

[features]
default = []
devtools = [
    "dep:serde",
    "dep:serde_json",
    "dep:png",
    "windows/Graphics_Capture",
    "windows/Graphics_DirectX_Direct3D11",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dwm",
    "windows/Win32_System_WinRT_Graphics_Capture",
    "windows/Win32_System_WinRT_Direct3D11",
    "windows/Win32_System_WinRT",
    "windows/Win32_System_Pipes",
    "windows/Win32_Storage_FileSystem",
    "windows/Win32_System_IO",
    "windows/Win32_Security_Cryptography",
    "windows/Foundation",
]

[[bin]]
name = "rust-ui-devctl"
path = "src/bin/rust-ui-devctl.rs"
required-features = ["devtools"]

[[example]]
name = "devctl_probe"
required-features = ["devtools"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
png = { version = "0.17", default-features = false, optional = true }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Ole", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_DirectWrite", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_RichEdit", "Win32_Globalization", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading","Win32_System_Console", "Win32_Security", "Win32_Graphics_Imaging", "Win32_Graphics_Dxgi_Common", "Win32_UI_Input_Ime", "Win32_UI_TextServices", "Win32_Graphics_Direct2D_Common"] }
windows-core = "0.62.2"
windows-numerics = "0.3.1"
